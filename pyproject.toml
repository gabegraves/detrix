[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detrix"
version = "0.1.0"
description = "Post-hoc governance for AI agent traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Detrix contributors" }]
dependencies = [
  "click>=8.1",
  "langfuse>=4.14.1,<5",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.scripts]
detrix = "detrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/detrix"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "detrix/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]
